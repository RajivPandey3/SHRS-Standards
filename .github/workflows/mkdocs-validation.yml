name: CI - MkDocs Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions mkdocs-awesome-pages-plugin

      - name: Build documentation (Strict Mode)
        # --strict ensures that any warning (like broken links) fails the build
        run: mkdocs build --strict

      - name: Check internal links across entire repository
        uses: lycheeverse/lychee-action@v1
        with:
          args: --offline "**/*.md"
          fail: true
