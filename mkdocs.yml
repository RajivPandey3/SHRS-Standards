site_name: SHRS Standards Repository
site_description: "The Canonical Knowledge Layer and Standards Governance Model"
site_author: "Standards Maintainer"
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink

nav:
  - Home: index.md
  - Program Roadmap: program/ROADMAP.md
  - Soul-Hunter Implementation:
      - Architecture:
          - Event Bus System: soul-hunter/architecture/event-bus.md
  - Architecture:
      - Architecture Decision Records (ADRs): architecture/ADRs/index.md
      - Decisions:
          - ADR-0001 (Founding Charter): architecture/ADRs/ADR-0001-founding-charter.md
          - ADR-0002 (Repository Architecture): architecture/ADRs/ADR-0002-repository-architecture.md
          - ADR-0003 (The SHRS Vision): architecture/ADRs/ADR-0003-shrs-vision.md
  - SHRS Ecosystem Constitution (SEC):
      - Index: standards/SEC/index.md
      - Articles:
          - Article 1 (Hierarchy): standards/SEC/chapters/article-1-hierarchy.md
          - Article 2 (Blueprint Boundary): standards/SEC/chapters/article-2-blueprint-boundary.md
          - Article 3 (Architectural Humility): standards/SEC/chapters/article-3-architectural-humility.md
  - Standards Governance Model (SGM):
      - Front Matter:
          - Preface: standards/SGM/front-matter/preface.md
          - Document Control: standards/SGM/front-matter/document-control.md
          - Revision History: standards/SGM/front-matter/revision-history.md
          - Review History: standards/SGM/front-matter/review-history.md
      - Chapters:
          - Chapter 1 (Purpose & Scope): standards/SGM/chapters/purpose-and-scope.md
          - Chapter 2 (Governance Principles): standards/SGM/chapters/governance-principles.md
          - Chapter 3 (Governance Structure): standards/SGM/chapters/governance-structure.md
          - Chapter 4 (Standards Lifecycle): standards/SGM/chapters/standards-lifecycle.md
          - Chapter 5 (Publication Governance): standards/SGM/chapters/release-governance.md
          - Chapter 6 (Governance Records): standards/SGM/chapters/governance-records.md
      - Annexes:
          - Annex A (Glossary): standards/SGM/annexes/glossary.md
          - Annex B (Editorial Style Guide): standards/SGM/annexes/editorial-style-guide.md
          - Annex C (Governance Record Templates): standards/SGM/annexes/governance-record-templates.md
          - Annex D (Lifecycle Examples): standards/SGM/annexes/lifecycle-examples.md
          - Annex E (Repository Structure Reference): standards/SGM/annexes/repository-structure-reference.md
          - Annex F (Requirement Traceability Matrix): standards/SGM/annexes/requirement-traceability-matrix.md
      - Metadata:
          - Changelog: standards/SGM/metadata/CHANGELOG.md
          - Decisions Log: standards/SGM/metadata/DECISIONS.md
          - Release Notes: standards/SGM/metadata/RELEASE_NOTES.md
          - Requirement Registry: standards/SGM/metadata/REQUIREMENT_REGISTRY.md
          - Session Log: standards/SGM/metadata/SESSION_LOG.md
          - Terminology Registry: standards/SGM/metadata/terminology-registry.md
  - Knowledge Package Publication Model (KPM):
      - Chapters:
          - Chapter 11 (Publication): standards/KPM/chapters/publication.md
          - Chapter 12 (Evolution): standards/KPM/chapters/evolution.md
          - Chapter 13 (Compliance): standards/KPM/chapters/compliance.md
          - Chapter 14 (Best Practices): standards/KPM/chapters/best-practices.md
          - Chapter 15 (Architectural Summary): standards/KPM/chapters/architectural-summary.md
  - Standards Editorial Guide (SEG):
      - Index: standards/SEG/index.md
      - Chapters:
          - Chapter 1 (Purpose & Scope): standards/SEG/chapters/purpose-and-scope.md
          - Chapter 2 (Game Terminology): standards/SEG/chapters/game-terminology.md
          - Chapter 3 (Editorial Tone): standards/SEG/chapters/editorial-tone.md
          - Chapter 4 (Markdown for Game Data): standards/SEG/chapters/markdown-game-data.md
          - Chapter 5 (Visuals & Media): standards/SEG/chapters/visuals-and-media.md
      - Annexes:
          - Annex A (GDD Template): standards/SEG/annexes/annex-a-gdd-template.md
          - Annex B (Technical Doc Template): standards/SEG/annexes/annex-b-technical-doc-template.md
  - Standards Authoring Operations (SAO):
      - Index: standards/SAO/index.md
      - Chapters:
          - Chapter 1 (Authoring Workflows): standards/SAO/chapters/authoring-workflows.md
          - Chapter 2 (Git Branching Strategy): standards/SAO/chapters/git-branching-strategy.md
          - Chapter 3 (Validation & CI/CD): standards/SAO/chapters/validation-and-cicd.md
      - Annexes:
          - Annex A (Pull Request Template): standards/SAO/annexes/annex-a-pr-template.md
          - Annex B (Work Order Template): standards/SAO/annexes/annex-b-work-order-template.md
